<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>RadarPro - Live Weather Radar</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- App CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/alerts.css">
</head>
<body>
  <div id="app">

    <!-- ============ HEADER BAR ============ -->
    <header id="header-bar">
      <div class="header-left">
        <div class="station-brand">
          <span class="brand-icon">📡</span>
          <div class="brand-text">
            <span class="station-name" id="station-name"></span>
            <span class="station-tagline" id="station-tagline"></span>
          </div>
        </div>
      </div>
      <div class="header-center">
        <div class="live-badge" id="live-badge">
          <span class="live-dot"></span>
          <span class="live-text">LIVE</span>
        </div>
        <div class="scene-label" id="scene-label">RADAR</div>
      </div>
      <div class="header-right">
        <div class="clock-container">
          <span class="clock-time" id="clock-time"></span>
          <span class="clock-date" id="clock-date"></span>
        </div>
      </div>
    </header>

    <!-- ============ ALERT BANNER ============ -->
    <div id="alert-banner" class="alert-banner hidden">
      <div class="alert-icon">⚠️</div>
      <div class="alert-content">
        <span class="alert-event" id="alert-event"></span>
        <span class="alert-headline" id="alert-headline"></span>
      </div>
      <div class="alert-badge" id="alert-count-badge"></div>
    </div>

    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar-left">
      <!-- Location Card -->
      <div class="glass-card location-card">
        <div class="card-header">
          <span class="card-icon">📍</span>
          <span class="card-title" id="location-name"></span>
        </div>
      </div>

      <!-- Current Conditions Card -->
      <div class="glass-card conditions-card">
        <div class="conditions-main">
          <span class="temp-display" id="current-temp">--°</span>
          <span class="conditions-icon" id="conditions-icon">🌡️</span>
        </div>
        <div class="conditions-text" id="conditions-text">Loading...</div>
        <div class="conditions-details">
          <div class="detail-item">
            <span class="detail-label">Feels Like</span>
            <span class="detail-value" id="feels-like">--°</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Humidity</span>
            <span class="detail-value" id="humidity">--%</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Wind</span>
            <span class="detail-value" id="wind-speed">-- mph</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Direction</span>
            <span class="detail-value" id="wind-dir">--</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Visibility</span>
            <span class="detail-value" id="visibility">-- mi</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Pressure</span>
            <span class="detail-value" id="pressure">-- mb</span>
          </div>
        </div>
      </div>

      <!-- Radar Info Card -->
      <div class="glass-card radar-info-card">
        <div class="card-header">
          <span class="card-icon">🛰️</span>
          <span class="card-title">Radar</span>
        </div>
        <div class="radar-timestamp" id="radar-timestamp">Loading radar...</div>
        <div class="radar-progress">
          <div class="radar-progress-bar" id="radar-progress-bar"></div>
        </div>
        <div class="radar-frame-info" id="radar-frame-info"></div>
      </div>

      <!-- Alert Summary Card -->
      <div class="glass-card alert-summary-card" id="alert-summary-card">
        <div class="card-header">
          <span class="card-icon">🔔</span>
          <span class="card-title">Alerts</span>
          <span class="alert-count" id="alert-count">0</span>
        </div>
        <div class="alert-list" id="alert-list">
          <div class="no-alerts">No active alerts</div>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN MAP ============ -->
    <main id="map-container">
      <div id="radar-map"></div>
      <div class="map-overlay-topleft" id="map-overlay-topleft"></div>
      <div class="map-overlay-bottomright" id="map-overlay-bottomright">
        <div class="radar-legend">
          <span class="legend-title">Precipitation</span>
          <div class="legend-bar">
            <span class="legend-label">Light</span>
            <div class="legend-gradient"></div>
            <span class="legend-label">Heavy</span>
          </div>
        </div>
      </div>
    </main>

    <!-- ============ FORECAST OVERLAY (scene) ============ -->
    <div id="forecast-overlay" class="scene-panel hidden">
      <div class="forecast-header">
        <span class="forecast-title">7-Day Forecast</span>
        <span class="forecast-location" id="forecast-location"></span>
      </div>
      <div class="forecast-grid" id="forecast-grid"></div>
    </div>

    <!-- ============ CAMERA PANEL (scene) ============ -->
    <div id="camera-panel" class="scene-panel hidden">
      <div class="camera-header">
        <span class="camera-title">📹 Live Cameras</span>
      </div>
      <div class="camera-grid" id="camera-grid"></div>
    </div>

    <!-- ============ BOTTOM TICKER ============ -->
    <footer id="ticker-bar">
      <div class="ticker-label">
        <span class="ticker-label-text">ALERTS</span>
      </div>
      <div class="ticker-track">
        <div class="ticker-content" id="ticker-content"></div>
      </div>
    </footer>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App JS (order matters) -->
  <script src="js/config.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/ticker.js"></script>
  <script src="js/cameras.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
